name: realtime-streaming

x-kafka-env: &kafka-env
  # KRaft: each node is a broker and controller
  KAFKA_PROCESS_ROLES: "broker,controller"

  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  # Listeners
  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"

  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  # Replication and fault tolerance
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 2

  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  # Storage
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:?required}


x-airflow-common: &airflow-common
  image: realtime-streaming-airflow:3.0.0
  pull_policy: never

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"spark://spark-master","port":7077}'

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?required}

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated

    PYSPARK_PYTHON: python3.12
    PYSPARK_DRIVER_PYTHON: python3.12

    PYTHONPATH: "/opt/airflow/project:/opt/airflow/project/spark"

    KAFKA_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
    SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    KAFKA_TOPIC: "randomuser_events_v2"

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./spark:/opt/airflow/project/spark:ro
    - ./jobs:/opt/airflow/project/jobs:ro

  user: "50000:0"


services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
  
  spark-master:
    image: twibot22-spark:3.5.3
    pull_policy: never
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8092:8080"
    restart: unless-stopped

  spark-worker:
    image: twibot22-spark:3.5.3
    pull_policy: never
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - 2G
      - --work-dir
      - /tmp/spark-worker
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "127.0.0.1:8093:8081"
    environment:
      PYSPARK_PYTHON: python3.12
      PYTHONPATH: "/opt/airflow/project:/opt/airflow/project/spark"
    volumes:
      - ./spark:/opt/airflow/project/spark:ro
      - ./jobs:/opt/airflow/project/jobs:ro
    restart: unless-stopped

  kafka-1:
    image: confluentinc/cp-kafka:8.4.0
    hostname: kafka-1
    restart: unless-stopped

    ports:
      - "127.0.0.1:9094:9092"

    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9094"

    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:8.4.0
    hostname: kafka-2
    restart: unless-stopped

    ports:
      - "127.0.0.1:9095:9092"

    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9095"

    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    image: confluentinc/cp-kafka:8.4.0
    hostname: kafka-3
    restart: unless-stopped

    ports:
      - "127.0.0.1:9096:9092"

    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9096"

    volumes:
      - kafka_3_data:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.0
    hostname: schema-registry
    restart: unless-stopped

    ports:
      - "127.0.0.1:8094:8081"

    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"

      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka-1:29092,kafka-2:29092,kafka-3:29092"

      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: "_schemas"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  control-center:
    image: confluentinc/cp-enterprise-control-center-next-gen:2.7.0
    hostname: control-center
    restart: unless-stopped

    ports:
      - "127.0.0.1:9021:9021"

    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - schema-registry

    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"

      CONTROL_CENTER_MODE_ENABLE: "management"
      CONTROL_CENTER_PROMETHEUS_ENABLE: "false"

      CONTROL_CENTER_REPLICATION_FACTOR: 3
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      PORT: 9021

    volumes:
      - control_center_data:/var/lib/confluent-control-center

    ulimits:
      nofile:
        soft: 16384
        hard: 16384

volumes:
  postgres_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  control_center_data:
